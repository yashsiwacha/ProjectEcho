databaseChangeLog:
  - changeSet:
      id: 1.0.0
      author: projectecho
      changes:
        - createTable:
            tableName: outbox_messages
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: aggregate_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: processed
                  type: boolean
                  constraints:
                    nullable: false
        - createTable:
            tableName: identity_passports
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: job_title
                  type: varchar(255)
                  constraints:
                    nullable: false
        - createTable:
            tableName: taxonomy_skills
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_skill_id
                  type: uuid
        - createTable:
            tableName: evidence_claims
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: passport_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: skill_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: source_uri
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: validation_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: trust_tier
                  type: int
                  constraints:
                    nullable: false
