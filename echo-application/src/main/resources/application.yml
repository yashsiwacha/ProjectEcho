server:
  port: 8081
spring:
  application:
    name: project-echo
  datasource:
    url: jdbc:postgresql://localhost:5432/project_echo
    username: echo
    password: echo_password
  jpa:
    hibernate:
      ddl-auto: update
  security:
    user:
      name: admin
      password: "${APP_PASSWORD:adminpwd}"
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
    audit:
      enabled: false

# JWT signing configuration (SEC-01 / ADR-006).
# The secret MUST be supplied via the JWT_SECRET environment variable.
# Never commit a real secret here. See .env.example.
echo:
  security:
    jwt:
      secret: "${JWT_SECRET}"
      expiration-ms: "${JWT_EXPIRATION_MS:86400000}"
      issuer: "${JWT_ISSUER:project-echo}"
