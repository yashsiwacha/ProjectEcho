name: Release CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend with Maven
        run: mvn -B -DskipTests clean package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/echo-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/echo-ui
        run: npm ci

      - name: Build frontend
        working-directory: frontend/echo-ui
        run: npm run build

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/projectecho/backend:latest -f backend/Dockerfile .
          docker build -t ghcr.io/projectecho/frontend:latest -f frontend/echo-ui/Dockerfile ./frontend/echo-ui

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GITHUB_ACTOR }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        run: |
          docker push ghcr.io/projectecho/backend:latest
          docker push ghcr.io/projectecho/frontend:latest

      - name: Run tests
        run: mvn test
