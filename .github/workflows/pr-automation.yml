name: PR Automation - YES Certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-certification:
    name: Backend Certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Code Formatting (Spotless)
        run: mvn spotless:check

      - name: Static Analysis (PMD & Checkstyle)
        run: mvn pmd:check checkstyle:check

      - name: Unit & Integration Tests (Coverage)
        run: mvn clean verify -Pcoverage

      - name: Architecture Review (ArchUnit)
        run: mvn test -Dtest=ArchitectureTest

      - name: Dependency Vulnerability Scan
        run: mvn org.owasp:dependency-check-maven:check

  frontend-certification:
    name: Frontend Certification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/echo-ui
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/echo-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Linting (ESLint)
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Production Build
        run: npm run build

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
