services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_password
      POSTGRES_DB: project_echo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/projectecho/backend:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_echo
      SPRING_DATASOURCE_USERNAME: echo
      SPRING_DATASOURCE_PASSWORD: echo_password
      APP_PASSWORD: ${APP_PASSWORD:-adminpwd}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - postgres
      - redis
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector:0.99.0
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  frontend:
    build:
      context: ./frontend/echo-ui
      dockerfile: Dockerfile
    image: ghcr.io/projectecho/frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
