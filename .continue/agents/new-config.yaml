name: ProjectEcho Local AI
version: 1.0.0
schema: v1

models:
  - name: Qwen 2.5 Coder
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - edit
      - apply

  - name: Qwen 3
    provider: ollama
    model: qwen3:8b
    roles:
      - summarize

embeddings:
  - provider: ollama
    model: nomic-embed-text

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder

rules:
  - |
    You are working on ProjectEcho.

    Always follow these engineering rules:

    - Java 21
    - Spring Boot 3
    - Constructor Injection only
    - Never use Field Injection
    - Prefer Clean Architecture
    - Respect existing module boundaries
    - Reuse existing abstractions before creating new ones
    - Write readable, maintainable code
    - Prefer